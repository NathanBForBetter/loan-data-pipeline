name: loan_analytics
version: '1.0.0'
config-version: 2

profile: loan_analytics

# Project paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Build artifacts
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# Model configurations
models:
  loan_analytics:
    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: table
      +schema: intermediate

    core:
      +materialized: table
      +schema: core

    marts:
      +materialized: table
      +schema: analytics

# Snapshot configurations
snapshots:
  loan_analytics:
    +target_schema: analytics
    +strategy: check

# Seed configurations
seeds:
  loan_analytics:
    +quote_columns: false