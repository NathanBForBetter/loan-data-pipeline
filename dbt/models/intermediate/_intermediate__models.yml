version: 2

models:
  - name: int_latest_loan_records
    description: >
      Latest available reporting record for each loan, plus a row_hash used
      by the snapshot to detect changes.

    columns:
      - name: loan_id
        description: Unique identifier for an individual loan.
        data_tests:
          - not_null
          - unique

      - name: report_month
        data_tests:
          - not_null

      - name: row_hash
        description: Hash of every column in loan_tracked_columns().
        data_tests:
          - not_null