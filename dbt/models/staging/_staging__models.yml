version: 2

models:
  - name: stg_loan_reports
    description: Cleaned and standardized LendingClub loan observations.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - loan_id
              - report_month
    columns:
      - name: loan_id
        data_tests:
          - not_null

      - name: report_date
        data_tests:
          - not_null

      - name: source_file
        data_tests:
          - not_null