version: 2

sources:
  - name: lending_club
    # DuckDB keeps raw tables in main; BigQuery keeps them in the loan_raw dataset.
    schema: "{{ 'main' if target.type == 'duckdb' else 'loan_raw' }}"
    description: Raw LendingClub monthly loan reports, every source column kept as text.

    tables:
      - name: raw_loans
        description: >
          Raw loan records loaded from monthly CSV reports. Column names are
          normalized at load time ('Unnamed: 0' becomes unnamed_0).

        columns:
          - name: id
            description: Unique identifier assigned to each loan.

          - name: report_date
            description: Date associated with the monthly source report.

          - name: source_file
            description: Original CSV filename.

          - name: ingested_at
            description: Load timestamp; staging uses it as its incremental watermark.

      - name: ingestion_log
        description: One row per successfully loaded file.