version: 2

models:
  # Kimball core: two facts and three dims.
  - name: fct_loan_current
    description: >
      One row per loan: its latest reported state, joined to the current
      dim_loans version.
    data_tests:
      - assert_grain:
          arguments:
            columns:
              - loan_id
    columns:
      - name: loan_key
        description: Surrogate key of the current dim_loans version.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_loans')
                field: loan_key
      - name: state_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: sub_grade_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_subgrade')
                field: sub_grade_key

  - name: fct_loan_monthly
    description: >
      One row per loan per report month (periodic snapshot fact), joined to
      the dim_loans version that was valid in that month.
    data_tests:
      - assert_grain:
          arguments:
            columns:
              - loan_id
              - report_month
    columns:
      - name: loan_key
        description: Surrogate key of the dim_loans version valid in report_month.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_loans')
                field: loan_key
      - name: report_month
        data_tests:
          - not_null
      - name: state_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: sub_grade_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_subgrade')
                field: sub_grade_key

  - name: dim_loans
    description: >
      One row per loan version (SCD Type 2, built from snap_loan_history).
      Filter on is_current for each loan's latest attributes.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - loan_id
          config:
            where: "is_current"
    columns:
      - name: loan_key
        data_tests:
          - unique
          - not_null
      - name: loan_id
        data_tests:
          - not_null

  - name: dim_state
    description: >
      One row per state.
    data_tests:
      - assert_grain:
          arguments:
            columns:
              - state_key
    columns:
      - name: state_key
        data_tests: [not_null, unique]
      - name: state
        data_tests: [not_null, unique]

  - name: dim_subgrade
    description: >
      One row per subgrade.
    data_tests:
      - assert_grain:
          arguments:
            columns:
              - sub_grade_key
    columns:
      - name: sub_grade_key
        data_tests: [not_null, unique]
      - name: sub_grade
        data_tests: [not_null, unique]